<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir tutor</title>
</head>
<body>

    <p>Tem certeza que deseja excluir "{{ object }}"?</p>

    </form>
</body>
</html>
